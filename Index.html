<!DOCTYPE html>
<html lang="es-CO">
<head>
    <!-- 1. CODIFICACIÓN Y CONFIGURACIÓN BÁSICA -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">

    <!-- 2. SEO BÁSICO -->
    <title>Diseños web</title>

    <meta name="description" content="Descripción clara y relevante del contenido de la página.">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="author" content="Nombre de la empresa">
    <meta name="publisher" content="Nombre de la empresa">
    <meta name="language" content="es">

    <!-- URL CANÓNICA -->
    <link rel="canonical" href="https://www.ejemplo.com/">

    <meta name="geo.placename" content="Medellín, Colombia">
    <meta name="geo.position" content="6.2442;-75.5812">
    <meta name="ICBM" content="6.2442, -75.5812">

    <!-- 4. OPEN GRAPH: FACEBOOK, WHATSAPP Y OTROS -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_CO">
    <meta property="og:site_name" content="Nombre de la empresa">
    <meta property="og:title" content="Título para compartir">
    <meta property="og:description" content="Descripción que aparecerá al compartir el enlace.">
    <meta property="og:url" content="https://www.ejemplo.com/">

    <meta property="og:image" content="https://www.ejemplo.com/assets/img/og-image.jpg">
    <meta property="og:image:alt" content="Descripción de la imagen">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">

    <!-- 5. TWITTER / X CARDS -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Título para X">
    <meta name="twitter:description" content="Descripción para compartir en X.">
    <meta name="twitter:image" content="https://www.ejemplo.com/assets/img/og-image.jpg">
    <meta name="twitter:image:alt" content="Descripción de la imagen">

    <!-- Cuentas opcionales de X -->
    <meta name="twitter:site" content="@cuenta_empresa">
    <meta name="twitter:creator" content="@autor">

    <!-- 6. ICONOS Y FAVICON -->
    <link rel="icon" href="/favicon.ico" sizes="any"> 

    <link rel="icon" type="image/png"sizes="32x32" href="./imagen/icono.png">

    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="/assets/icons/favicon-16x16.png">

    <link rel="apple-touch-icon"
          sizes="180x180"
          href="/assets/icons/apple-touch-icon.png">

    <link rel="manifest" href="/site.webmanifest">

    <!-- 7. COLOR DEL NAVEGADOR Y MÓVILES -->
    <meta name="theme-color" content="#0D6EFD">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title"
        content="prueba">

    <!-- 8. IDIOMA Y VERSIONES INTERNACIONALES -->
    <link rel="alternate"
          hreflang="es-CO"
          href="https://www.ejemplo.com/">

    <link rel="alternate"

    <link rel="alternate"
          hreflang="x-default"
